name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # npm 12 blocks dependency lifecycle scripts by default (esbuild needs its
      # postinstall); pin 11.x until we add an allowlist.
      - run: npm install -g "npm@^11.6"
      - run: npm ci
      - run: npm run typecheck
      # tests/ is excluded from tsconfig.json, so the type-level destination contract
      # gets its own project — otherwise a regression in the union is never checked.
      - run: npm run typecheck:contract
      - run: npm test
      - run: npm run build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the SDK from this checkout, not from PyPI: mcp/pyproject.toml pins a
      # version that only exists once the SDK release has landed, so relying on PyPI made CI
      # fail on the very commit that introduces the bump (observed on 9265bc4). The release
      # workflow deliberately does install from PyPI — there we *want* to prove the MCP server
      # works against the published SDK.
      - run: pip install -e ../python
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # CI has no API key, and the selftest deliberately exits 2 rather than reporting a green
      # run for an unconfigured server. Assert that, plus the tool manifest — a wiring
      # regression that dropped a tool would otherwise still look fine.
      - name: selftest fails loudly without a key (and lists all six tools)
        run: |
          set +e
          python -m videofetch_mcp.server --selftest > selftest.out 2>&1
          code=$?
          set -e
          cat selftest.out
          test "$code" -eq 2 || { echo "expected exit 2 with no key, got $code"; exit 1; }
          grep -q "key    : MISSING" selftest.out
          test "$(grep -c '^  - ' selftest.out)" -eq 6 || { echo "expected 6 tools"; exit 1; }
